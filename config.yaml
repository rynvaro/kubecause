# KubeCause 配置中心（Slice 8）
#
# 启动时先读这个文件，没有文件就用默认值；环境变量可以覆盖这里的值，
# 环境变量优先于文件，方便部署时改（例如 CHAT_MAX_STEPS=16）。
# 改完后不用重启：前端“设置”页 POST /api/config 保存后立即生效。
#
# 注意：MODEL_API_KEY 绝不写在这里，只从环境变量读。
# 这个文件会进仓库、进交付 zip，写进 Key 等于公开泄露。
#
# 每个参数的含义见 README “配置中心”一节。

chat:
  # 对话最大工具步数：一轮对话里模型最多调几次工具。
  # 它是预算，不是决策：调大它不干预模型怎么选工具，
  # 只是允许模型在一轮里查得更多；步数用完时后端返回已查到的半成品，
  # 而不是直接报错。默认 12（Slice 7 及以前是 8）。
  maxSteps: 12
  # 每次调用模型时带上的最近用户/助手消息条数，只算 user 和 assistant，
  # tool 消息不占名额：一轮对话会存好几条 tool 消息，按全量行数算时
  # “最近 10 条”实际只够覆盖一轮，聊两三轮就丢了最早那轮的目标。
  # 更早的消息数据库里全量保留，只是暂时不进模型上下文。默认 10。
  maxHistoryMessages: 10
  # 对话自动摘要（issue #19）：超出近期窗口的旧对话的滚动摘要。
  summary:
    # 总开关，默认 true。关掉后不生成新摘要，也不把已有摘要带进上下文，
    # 已存的摘要和游标保留在库里，再打开时接着增量更新，不用重算。
    enabled: true
    # 触发一次摘要需要的未覆盖消息条数，默认 10：近期窗口默认 10 条，
    # 所以 user/assistant 消息总数超过 20 条时首次触发。
    # 未覆盖 = 不在最近窗口内、且还没被摘要覆盖过的 user/assistant 消息；
    # 触发时一次性覆盖掉全部未覆盖消息，游标推到最后一条。
    triggerMessages: 10

run:
  # 单次诊断（/api/runs）最大模型轮次，默认 8。
  # 和对话的 12 步是分开的两个预算，不要混成一个。
  # 一轮里模型可以一次返回多个工具调用，轮次只算模型决策的次数，
  # 不按工具调用的行数算（issue #6）。
  maxSteps: 8
  # 单次诊断整体超时秒数，默认 60。
  timeoutSeconds: 60
  # 一轮里模型最多调几个不同的工具调用，默认 5。
  # 超过上限的调用不执行，记一步错误告诉模型分轮调。
  maxToolCallsPerRound: 5

model:
  # 每次模型 API 调用的超时秒数，默认 30。
  timeoutSeconds: 30
  # 模型温度，0-1，默认 0.2。诊断场景温度越低，模型越按证据说话。
  temperature: 0.2
  # 每次模型请求的最大输出 token，默认 4096。
  # 0 表示不传 max_tokens 字段，走模型默认；非 0 时按这个值发。
  # 诊断报告一般只有几百 token，基本碰不到上限，只是防单次输出失控。
  # 累计预算不在这里做，等真实用量数据出来再定。
  maxTokens: 4096

repair:
  # 修复建议允许的新值上限（MiB），默认 4096 即 4Gi。
  maxMemoryMi: 4096
  # 修复新值相对旧值的最大倍数，默认 4，即新值不超过旧值的 4 倍。
  # 两个上限取更严的那一个。
  maxRatio: 4
