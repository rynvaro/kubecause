<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 960" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="960" fill="#ffffff"/>
  <text x="520" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">KubeCause 架构图</text>
  <text x="520" y="62" text-anchor="middle" font-size="13" fill="#64748b">对话（一问一答）与单次诊断（填表提交）；修复只走审批；节点工具走 MCP 子进程</text>

  <!-- 前端 -->
  <rect x="320" y="80" width="400" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="520" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">前端 · Vite + React 18 + TypeScript</text>
  <text x="520" y="125" text-anchor="middle" font-size="12" fill="#1e40af">frontend/src → web/dist → go:embed 进 Go 二进制</text>

  <line x1="520" y1="138" x2="520" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API -->
  <rect x="320" y="160" width="400" height="58" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="520" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#3730a3">HTTP API · internal/api</text>
  <text x="520" y="205" text-anchor="middle" font-size="12" fill="#3730a3">/api/conversations · /api/runs · /api/config</text>

  <line x1="520" y1="218" x2="520" y2="229" stroke="#64748b" stroke-width="1.5"/>
  <line x1="270" y1="229" x2="770" y2="229" stroke="#64748b" stroke-width="1.5"/>
  <line x1="270" y1="229" x2="270" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="229" x2="770" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 对话 -->
  <rect x="60" y="240" width="420" height="118" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="270" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">对话服务 · chat.Service</text>
  <text x="270" y="290" text-anchor="middle" font-size="12.5" fill="#14532d">RunMessage 落盘 → 取最近 10 条历史 → runReal 循环</text>
  <text x="270" y="311" text-anchor="middle" font-size="12.5" fill="#14532d">调模型、执行工具，结果以 tool 消息追加</text>
  <text x="270" y="332" text-anchor="middle" font-size="12.5" fill="#14532d">默认只读；修复只给建议卡，不直接改集群</text>

  <!-- 单次诊断 -->
  <rect x="560" y="240" width="420" height="118" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="770" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">单次诊断 + Worker</text>
  <text x="770" y="290" text-anchor="middle" font-size="12.5" fill="#78350f">POST /api/runs 建任务，返回 202</text>
  <text x="770" y="311" text-anchor="middle" font-size="12.5" fill="#78350f">Worker 每 500ms 认领 → agent.Run 出报告</text>
  <text x="770" y="332" text-anchor="middle" font-size="12.5" fill="#78350f">报告 → 提案 → 人工审批 → 执行 Patch → 验证</text>

  <!-- 两条线汇入模型 -->
  <line x1="270" y1="358" x2="270" y2="375" stroke="#64748b" stroke-width="1.5"/>
  <line x1="770" y1="358" x2="770" y2="375" stroke="#64748b" stroke-width="1.5"/>
  <line x1="270" y1="375" x2="770" y2="375" stroke="#64748b" stroke-width="1.5"/>
  <line x1="520" y1="375" x2="520" y2="392" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 模型 -->
  <rect x="320" y="392" width="400" height="88" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="520" y="418" text-anchor="middle" font-size="15" font-weight="bold" fill="#581c87">模型适配 · internal/model</text>
  <text x="520" y="440" text-anchor="middle" font-size="12.5" fill="#581c87">Chat / Next · 12 内置工具 + 5 MCP 节点工具</text>
  <text x="520" y="461" text-anchor="middle" font-size="12.5" fill="#581c87">tools 是顶层独立字段；system 只放角色和规则</text>

  <!-- DeepSeek -->
  <rect x="760" y="392" width="220" height="88" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="870" y="418" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">DeepSeek API</text>
  <text x="870" y="440" text-anchor="middle" font-size="12.5" fill="#334155">OpenAI 兼容接口</text>
  <text x="870" y="461" text-anchor="middle" font-size="12.5" fill="#334155">Key 只走环境变量</text>
  <line x1="720" y1="436" x2="760" y2="436" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="520" y1="480" x2="520" y2="506" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 模型 → MCP Client（节点工具走 MCP） -->
  <line x1="700" y1="480" x2="700" y2="493" stroke="#9333ea" stroke-width="1.5"/>
  <line x1="700" y1="493" x2="870" y2="493" stroke="#9333ea" stroke-width="1.5"/>
  <line x1="870" y1="493" x2="870" y2="506" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 工具适配器 -->
  <rect x="320" y="506" width="400" height="66" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <text x="520" y="531" text-anchor="middle" font-size="15" font-weight="bold" fill="#164e63">工具适配器 · internal/run.ToolsAdapter</text>
  <text x="520" y="552" text-anchor="middle" font-size="12" fill="#164e63">K8s 对象 → 摘要 + 结构化行（一种 PodRow 形状）</text>

  <line x1="520" y1="572" x2="520" y2="596" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- kube -->
  <rect x="320" y="596" width="400" height="66" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="520" y="621" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">K8s 客户端 · internal/kube</text>
  <text x="520" y="642" text-anchor="middle" font-size="12" fill="#7c2d12">fake 演示数据 / real 读 KUBECONFIG · 读、写两个独立对象</text>

  <line x1="520" y1="662" x2="520" y2="686" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 集群 -->
  <rect x="320" y="686" width="400" height="54" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="520" y="708" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Kubernetes 集群</text>
  <text x="520" y="729" text-anchor="middle" font-size="12" fill="#1e293b">kind（本地演示）/ k3s（云）</text>

  <!-- MCP Client -->
  <rect x="760" y="506" width="220" height="66" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="870" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#581c87">MCP Client · mcpclient</text>
  <text x="870" y="551" text-anchor="middle" font-size="11.5" fill="#581c87">拉子进程走 stdio · 失败只警告</text>

  <line x1="870" y1="572" x2="870" y2="596" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- MCP Server -->
  <rect x="760" y="596" width="220" height="118" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="870" y="620" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">MCP Server · cmd/mcp-server</text>
  <text x="870" y="641" text-anchor="middle" font-size="11.5" fill="#334155">独立进程 · stdio · 5 个节点工具</text>
  <text x="870" y="660" text-anchor="middle" font-size="11" fill="#334155">node_list · node_disk · node_memory</text>
  <text x="870" y="679" text-anchor="middle" font-size="11" fill="#334155">node_processes · node_logs</text>
  <text x="870" y="698" text-anchor="middle" font-size="11" fill="#334155">调试 Pod + chroot /host</text>

  <!-- MCP Server → 集群（建调试 Pod） -->
  <line x1="760" y1="665" x2="722" y2="708" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="741" y="682" text-anchor="middle" font-size="11" fill="#ea580c">建调试 Pod</text>

  <!-- 支撑层 -->
  <rect x="40" y="772" width="300" height="104" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="800" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">存储 · SQLite（internal/store）</text>
  <text x="190" y="822" text-anchor="middle" font-size="12" fill="#475569">conversations / messages</text>
  <text x="190" y="842" text-anchor="middle" font-size="12" fill="#475569">runs / run_steps / change_requests</text>
  <text x="190" y="862" text-anchor="middle" font-size="12" fill="#475569">对话、诊断、审批共用</text>

  <rect x="370" y="772" width="300" height="104" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="520" y="800" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">知识库 · FTS5 RAG</text>
  <text x="520" y="822" text-anchor="middle" font-size="12" fill="#475569">runbooks/*.md 8 篇手册</text>
  <text x="520" y="842" text-anchor="middle" font-size="12" fill="#475569">search_runbooks 关键词检索</text>
  <text x="520" y="862" text-anchor="middle" font-size="12" fill="#475569">暂不用向量库</text>

  <rect x="700" y="772" width="300" height="104" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="850" y="800" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">配置中心 · config.yaml</text>
  <text x="850" y="822" text-anchor="middle" font-size="12" fill="#475569">步数 / 温度 / 内存上限</text>
  <text x="850" y="842" text-anchor="middle" font-size="12" fill="#475569">前端设置页改完立即生效</text>
  <text x="850" y="862" text-anchor="middle" font-size="12" fill="#475569">MODEL_API_KEY 不进配置</text>

  <!-- 安全带 -->
  <rect x="40" y="900" width="960" height="40" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="520" y="925" text-anchor="middle" font-size="14" fill="#b91c1c">安全：只读工具自动执行 · 改集群必须人工审批 · ValidatePatch 白名单校验 · 系统命名空间禁写</text>
</svg>
